# Сборка и тесты VK Tools.
# Версии зафиксированы: SDK .NET и действия GitHub — точные релизы, не «latest» (docs/DEPENDENCIES.md).
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SDK_VERSION: 8.0.424
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Directory.Build.props: при CI=true предупреждения считаются ошибками
  CI: true

jobs:
  test:
    name: Tests and build for Revit 2021-2026
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-dotnet@v4.3.0
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
      - name: Unit tests
        run: dotnet test tests/VKTools.Core.Tests -c Release
      - name: Build add-in for every Revit version
        run: |
          set -e
          for v in 2021 2022 2023 2024 2025 2026; do
            dotnet build src/VKTools.Revit/VKTools.Revit.csproj -c Release -p:RevitVersion=$v
          done

  installer:
    name: MSI installer
    runs-on: windows-2025
    needs: test
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-dotnet@v4.3.0
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
      - name: Build add-in for department versions (2021, 2022, 2024)
        shell: pwsh
        run: |
          foreach ($v in 2021, 2022, 2024) {
            dotnet build src/VKTools.Revit/VKTools.Revit.csproj -c Release -p:RevitVersion=$v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build MSI
        run: dotnet build installer/VKTools.Installer.wixproj -c Release
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: VKTools-msi
          path: installer/bin/Release/*.msi
          if-no-files-found: error
          retention-days: 30

  # Постоянная ссылка на свежий MSI для проверки в Revit (без поиска артефакта на странице сборки):
  # https://github.com/Midehatovich/VKTools/releases/download/test-build/VKTools.msi
  # Пре-релиз «test-build» перезаписывается последней успешной сборкой (PR или main); это не выпуск для отдела.
  publish-test-build:
    name: Publish test-build MSI
    runs-on: ubuntu-24.04
    needs: installer
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          name: VKTools-msi
          path: msi
      - name: Upload to pre-release test-build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE: ${{ github.event_name == 'pull_request' && format('PR #{0} ({1})', github.event.pull_request.number, github.head_ref) || github.ref_name }}
        run: |
          set -e
          file=$(ls msi/*.msi | head -n 1)
          cp "$file" VKTools.msi
          notes="Тестовая сборка: $(basename "$file"), источник: $SOURCE, коммит ${GITHUB_SHA::7}, $(date -u '+%Y-%m-%d %H:%M') UTC."
          if ! gh release view test-build >/dev/null 2>&1; then
            gh release create test-build --prerelease --target main --title "VK Tools — тестовая сборка" --notes "$notes"
          fi
          gh release upload test-build VKTools.msi --clobber
          gh release edit test-build --prerelease --notes "$notes"
